# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0     # Scale to zero saat tidak ada traffic (hemat biaya)
  maxInstances: 1     # Cukup 1 instance untuk skala pesantren

env:
  # Nilai statis yang aman dimasukkan ke file (bukan secret)
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: my-halaqoh
    availability:
      - BUILD
      - RUNTIME

  # Variabel berikut diisi via Firebase Console → App Hosting → Settings → Environment Variables
  # NEXT_PUBLIC_FIREBASE_API_KEY
  # NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  # NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  # NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  # NEXT_PUBLIC_FIREBASE_APP_ID
